<svg xmlns="http://www.w3.org/2000/svg" width="850" height="120" viewBox="0 0 850 120">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5d4;stop-opacity:0"/>
      <stop offset="25%" style="stop-color:#00f5d4;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#7b61ff;stop-opacity:0.8"/>
      <stop offset="75%" style="stop-color:#00f5d4;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00f5d4;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes waveMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-120px); }
    }
    @keyframes statusBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes barPulse1 {
      0%, 100% { height: 8px; y: 92; }
      50% { height: 20px; y: 80; }
    }
    @keyframes barPulse2 {
      0%, 100% { height: 14px; y: 86; }
      50% { height: 25px; y: 75; }
    }
    @keyframes barPulse3 {
      0%, 100% { height: 10px; y: 90; }
      50% { height: 18px; y: 82; }
    }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(5px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -20; }
    }
    .wave-anim { animation: waveMove 3s linear infinite; }
    .status-dot { animation: statusBlink 2s ease-in-out infinite; }
    .bar1 { animation: barPulse1 1.5s ease-in-out infinite; }
    .bar2 { animation: barPulse2 1.8s ease-in-out infinite; }
    .bar3 { animation: barPulse3 1.3s ease-in-out infinite; }
    .motto { animation: fadeInUp 1s ease-out forwards; }
    .dash-anim { animation: dashMove 1.5s linear infinite; }
  </style>
  
  <!-- Background -->
  <rect width="850" height="120" fill="url(#footerBg)"/>
  
  <!-- Top separator line -->
  <line x1="30" y1="8" x2="820" y2="8" stroke="#00f5d4" stroke-width="0.4" opacity="0.2"/>
  
  <!-- Audio waveform / equalizer bars (left side) -->
  <g transform="translate(40, 0)">
    <rect x="0" y="90" width="3" height="10" rx="1" fill="#00f5d4" opacity="0.5" class="bar1"/>
    <rect x="6" y="85" width="3" height="15" rx="1" fill="#00f5d4" opacity="0.6" class="bar2"/>
    <rect x="12" y="88" width="3" height="12" rx="1" fill="#7b61ff" opacity="0.5" class="bar3"/>
    <rect x="18" y="82" width="3" height="18" rx="1" fill="#00f5d4" opacity="0.7" class="bar1" style="animation-delay: 0.2s"/>
    <rect x="24" y="86" width="3" height="14" rx="1" fill="#7b61ff" opacity="0.5" class="bar2" style="animation-delay: 0.3s"/>
    <rect x="30" y="90" width="3" height="10" rx="1" fill="#00f5d4" opacity="0.6" class="bar3" style="animation-delay: 0.4s"/>
    <rect x="36" y="84" width="3" height="16" rx="1" fill="#00f5d4" opacity="0.5" class="bar1" style="animation-delay: 0.5s"/>
    <rect x="42" y="88" width="3" height="12" rx="1" fill="#7b61ff" opacity="0.6" class="bar2" style="animation-delay: 0.6s"/>
  </g>
  
  <!-- Mission badge / status indicator (left center) -->
  <g transform="translate(115, 35)">
    <rect x="0" y="0" width="140" height="50" rx="6" fill="none" stroke="#00f5d4" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,4" class="dash-anim"/>
    <circle cx="18" cy="25" r="5" fill="#00f5d4" opacity="0.15"/>
    <circle cx="18" cy="25" r="3" fill="#00f5d4" class="status-dot" filter="url(#glow)"/>
    <text x="32" y="21" font-family="'Consolas','Monaco','Courier New',monospace" font-size="8" fill="#8b949e" letter-spacing="1.5">STATUS</text>
    <text x="32" y="35" font-family="'Consolas','Monaco','Courier New',monospace" font-size="11" fill="#00f5d4" filter="url(#glow)">BUILDING...</text>
  </g>
  
  <!-- Central motto -->
  <g class="motto">
    <text x="425" y="48" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue','Arial',sans-serif" font-size="16" font-weight="600" fill="#e6edf3" letter-spacing="1" filter="url(#glow)">
      "Ship fast. Learn faster. Break nothing."
    </text>
    <text x="425" y="72" text-anchor="middle" font-family="'Consolas','Monaco','Courier New',monospace" font-size="10" fill="#8b949e" letter-spacing="1">
      Building intelligent systems, one commit at a time
    </text>
  </g>
  
  <!-- Right side: signal waveform -->
  <g transform="translate(660, 0)" opacity="0.4">
    <rect x="0" y="90" width="3" height="10" rx="1" fill="#7b61ff" class="bar3" style="animation-delay: 0.1s"/>
    <rect x="6" y="84" width="3" height="16" rx="1" fill="#00f5d4" class="bar1" style="animation-delay: 0.3s"/>
    <rect x="12" y="87" width="3" height="13" rx="1" fill="#7b61ff" class="bar2" style="animation-delay: 0.5s"/>
    <rect x="18" y="82" width="3" height="18" rx="1" fill="#00f5d4" class="bar3" style="animation-delay: 0.7s"/>
    <rect x="24" y="86" width="3" height="14" rx="1" fill="#7b61ff" class="bar1" style="animation-delay: 0.9s"/>
    <rect x="30" y="90" width="3" height="10" rx="1" fill="#00f5d4" class="bar2" style="animation-delay: 1.1s"/>
    <rect x="36" y="85" width="3" height="15" rx="1" fill="#7b61ff" class="bar3" style="animation-delay: 0.2s"/>
    <rect x="42" y="88" width="3" height="12" rx="1" fill="#00f5d4" class="bar1" style="animation-delay: 0.4s"/>
  </g>
  
  <!-- Version / build info -->
  <text x="770" y="50" text-anchor="middle" font-family="'Consolas','Monaco','Courier New',monospace" font-size="8" fill="#484f58" letter-spacing="1">
    v2026.11 // BUILD OK
  </text>
  <text x="770" y="65" text-anchor="middle" font-family="'Consolas','Monaco','Courier New',monospace" font-size="8" fill="#484f58" letter-spacing="1">
    VIJAYARAMANUJAM.DEV
  </text>
  
  <!-- Bottom wave line -->
  <line x1="30" y1="105" x2="820" y2="105" stroke="url(#waveGrad)" stroke-width="0.6" opacity="0.3"/>
  
  <!-- Outer frame -->
  <rect x="2" y="2" width="846" height="116" rx="8" fill="none" stroke="#00f5d4" stroke-width="0.4" opacity="0.12"/>
</svg>
