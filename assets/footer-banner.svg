<svg xmlns="http://www.w3.org/2000/svg" width="850" height="140" viewBox="0 0 850 140">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020515"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="waveG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5d4;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#00f5d4;stop-opacity:0.5"/>
      <stop offset="40%" style="stop-color:#00d4ff;stop-opacity:0.7"/>
      <stop offset="60%" style="stop-color:#7b61ff;stop-opacity:0.7"/>
      <stop offset="80%" style="stop-color:#ff61d4;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#ff61d4;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00f5d4;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00f5d4;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7b61ff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#7b61ff;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow2"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
    @keyframes eq1 { 0%,100%{height:8px;y:105} 50%{height:28px;y:85} }
    @keyframes eq2 { 0%,100%{height:14px;y:99} 50%{height:32px;y:81} }
    @keyframes eq3 { 0%,100%{height:10px;y:103} 50%{height:22px;y:91} }
    @keyframes fadeIn { 0%{opacity:0;transform:translateY(5px)} 100%{opacity:1;transform:translateY(0)} }
    @keyframes dash { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:-20} }
    @keyframes orbF { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(5px,-3px) scale(1.05)} }
    @keyframes wave { 0%{transform:translateX(0)} 100%{transform:translateX(-60px)} }
    .bk{animation:blink 2s ease-in-out infinite}
    .e1{animation:eq1 1.5s ease-in-out infinite}
    .e2{animation:eq2 1.8s ease-in-out infinite}
    .e3{animation:eq3 1.3s ease-in-out infinite}
    .fi{animation:fadeIn 1s ease-out forwards}
    .da{animation:dash 1.5s linear infinite}
    .of{animation:orbF 6s ease-in-out infinite}
  </style>

  <rect width="850" height="140" fill="url(#bg)"/>

  <!-- Background orbs -->
  <circle cx="150" cy="70" r="80" fill="url(#orb1)" class="of"/>
  <circle cx="700" cy="70" r="90" fill="url(#orb2)" class="of" style="animation-delay:2s"/>

  <!-- Top gradient line -->
  <line x1="20" y1="8" x2="830" y2="8" stroke="url(#waveG)" stroke-width="1" opacity="0.4"/>

  <!-- Left EQ bars -->
  <g transform="translate(30, 0)" opacity="0.6">
    <rect x="0" y="103" width="3.5" height="10" rx="1.5" fill="#00f5d4" class="e1"/>
    <rect x="6" y="97" width="3.5" height="16" rx="1.5" fill="#00d4ff" class="e2"/>
    <rect x="12" y="100" width="3.5" height="13" rx="1.5" fill="#7b61ff" class="e3"/>
    <rect x="18" y="93" width="3.5" height="20" rx="1.5" fill="#00f5d4" class="e1" style="animation-delay:0.2s"/>
    <rect x="24" y="97" width="3.5" height="16" rx="1.5" fill="#ff61d4" class="e2" style="animation-delay:0.3s"/>
    <rect x="30" y="101" width="3.5" height="12" rx="1.5" fill="#00d4ff" class="e3" style="animation-delay:0.4s"/>
    <rect x="36" y="95" width="3.5" height="18" rx="1.5" fill="#00f5d4" class="e1" style="animation-delay:0.5s"/>
    <rect x="42" y="99" width="3.5" height="14" rx="1.5" fill="#7b61ff" class="e2" style="animation-delay:0.6s"/>
    <rect x="48" y="103" width="3.5" height="10" rx="1.5" fill="#ff61d4" class="e3" style="animation-delay:0.7s"/>
    <rect x="54" y="96" width="3.5" height="17" rx="1.5" fill="#00f5d4" class="e1" style="animation-delay:0.8s"/>
  </g>

  <!-- Status badge -->
  <g transform="translate(110, 35)">
    <rect x="0" y="0" width="148" height="52" rx="8" fill="none" stroke="#00f5d4" stroke-width="0.8" opacity="0.25" stroke-dasharray="5,4" class="da"/>
    <rect x="2" y="2" width="144" height="48" rx="7" fill="#0a0e1a" opacity="0.8"/>
    <circle cx="20" cy="26" r="6" fill="#00f5d4" opacity="0.1"/>
    <circle cx="20" cy="26" r="3.5" fill="#00f5d4" class="bk" filter="url(#glow)"/>
    <text x="35" y="21" font-family="'Consolas',monospace" font-size="8" fill="#8b949e" letter-spacing="1.5">STATUS</text>
    <text x="35" y="37" font-family="'Consolas',monospace" font-size="12" fill="#00f5d4" filter="url(#glow)" font-weight="bold">BUILDING...</text>
  </g>

  <!-- Central motto -->
  <g class="fi">
    <text x="425" y="50" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue','Arial',sans-serif" font-size="18" font-weight="700" fill="#e6edf3" letter-spacing="1.5" filter="url(#glow)">
      "Ship fast. Learn faster. Break nothing."
    </text>
    <text x="425" y="76" text-anchor="middle" font-family="'Consolas','Monaco','Courier New',monospace" font-size="10" fill="#8b949e" letter-spacing="1">
      Building intelligent systems, one commit at a time &#x2022; CIT Chennai
    </text>
  </g>

  <!-- Decorative 3D cubes (right side) -->
  <g transform="translate(710, 30)" opacity="0.15">
    <polygon points="12,0 24,6 12,12 0,6" fill="#00f5d4" stroke="#00f5d4" stroke-width="0.5"/>
    <polygon points="0,6 12,12 12,22 0,16" fill="#00f5d4" opacity="0.6" stroke="#00f5d4" stroke-width="0.3"/>
    <polygon points="12,12 24,6 24,16 12,22" fill="#00f5d4" opacity="0.3" stroke="#00f5d4" stroke-width="0.3"/>
  </g>
  <g transform="translate(740, 42)" opacity="0.1">
    <polygon points="10,0 20,5 10,10 0,5" fill="#7b61ff" stroke="#7b61ff" stroke-width="0.5"/>
    <polygon points="0,5 10,10 10,18 0,13" fill="#7b61ff" opacity="0.6" stroke="#7b61ff" stroke-width="0.3"/>
    <polygon points="10,10 20,5 20,13 10,18" fill="#7b61ff" opacity="0.3" stroke="#7b61ff" stroke-width="0.3"/>
  </g>

  <!-- Right EQ bars -->
  <g transform="translate(760, 0)" opacity="0.5">
    <rect x="0" y="103" width="3.5" height="10" rx="1.5" fill="#7b61ff" class="e3" style="animation-delay:0.1s"/>
    <rect x="6" y="95" width="3.5" height="18" rx="1.5" fill="#00f5d4" class="e1" style="animation-delay:0.3s"/>
    <rect x="12" y="98" width="3.5" height="15" rx="1.5" fill="#ff61d4" class="e2" style="animation-delay:0.5s"/>
    <rect x="18" y="93" width="3.5" height="20" rx="1.5" fill="#00d4ff" class="e3" style="animation-delay:0.7s"/>
    <rect x="24" y="97" width="3.5" height="16" rx="1.5" fill="#7b61ff" class="e1" style="animation-delay:0.9s"/>
    <rect x="30" y="101" width="3.5" height="12" rx="1.5" fill="#00f5d4" class="e2" style="animation-delay:1.1s"/>
    <rect x="36" y="96" width="3.5" height="17" rx="1.5" fill="#ff61d4" class="e3" style="animation-delay:0.2s"/>
    <rect x="42" y="99" width="3.5" height="14" rx="1.5" fill="#00d4ff" class="e1" style="animation-delay:0.4s"/>
    <rect x="48" y="103" width="3.5" height="10" rx="1.5" fill="#00f5d4" class="e2" style="animation-delay:0.6s"/>
    <rect x="54" y="95" width="3.5" height="18" rx="1.5" fill="#7b61ff" class="e3" style="animation-delay:0.8s"/>
  </g>

  <!-- Version / sign-off -->
  <text x="425" y="105" text-anchor="middle" font-family="'Consolas',monospace" font-size="8" fill="#484f58" letter-spacing="1.5">
    v2026.11 // VIJAYARAMANUJAM.DEV // OPEN TO COLLABORATE
  </text>

  <!-- Bottom gradient line -->
  <line x1="20" y1="120" x2="830" y2="120" stroke="url(#waveG)" stroke-width="0.6" opacity="0.25"/>

  <!-- Frame -->
  <rect x="1" y="1" width="848" height="138" rx="10" fill="none" stroke="#00f5d4" stroke-width="0.3" opacity="0.1"/>
</svg>
