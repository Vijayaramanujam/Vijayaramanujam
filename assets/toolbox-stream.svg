<svg xmlns="http://www.w3.org/2000/svg" width="850" height="320" viewBox="0 0 850 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-850px); }
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes borderGlow {
      0%, 100% { stroke-opacity: 0.2; }
      50% { stroke-opacity: 0.5; }
    }
    @keyframes dotPulse {
      0%, 100% { r: 2; fill-opacity: 0.4; }
      50% { r: 3; fill-opacity: 0.9; }
    }
    .card { animation: fadeIn 0.6s ease-out forwards; }
    .card-border { animation: borderGlow 3s ease-in-out infinite; }
    .skill-dot { animation: dotPulse 2s ease-in-out infinite; }
    .section-title { font-family: 'Consolas','Monaco','Courier New',monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
    .skill-text { font-family: 'Segoe UI','Helvetica Neue','Arial',sans-serif; font-size: 12px; }
    .cat-icon { font-family: 'Segoe UI','Helvetica Neue','Arial',sans-serif; font-size: 14px; }
  </style>
  
  <!-- Background -->
  <rect width="850" height="320" fill="url(#bg)"/>
  
  <!-- Subtle grid -->
  <g opacity="0.03">
    <line x1="0" y1="80" x2="850" y2="80" stroke="#00f5d4" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="850" y2="160" stroke="#00f5d4" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="850" y2="240" stroke="#00f5d4" stroke-width="0.5"/>
    <line x1="212" y1="0" x2="212" y2="320" stroke="#00f5d4" stroke-width="0.5"/>
    <line x1="425" y1="0" x2="425" y2="320" stroke="#00f5d4" stroke-width="0.5"/>
    <line x1="637" y1="0" x2="637" y2="320" stroke="#00f5d4" stroke-width="0.5"/>
  </g>

  <!-- Section header -->
  <text x="425" y="28" text-anchor="middle" class="section-title" fill="#00f5d4" filter="url(#glow)" opacity="0.9">
    &#x276E; TECH STACK &#x276F;
  </text>
  <line x1="150" y1="38" x2="700" y2="38" stroke="#00f5d4" stroke-width="0.3" opacity="0.2"/>
  
  <!-- ═══════════════ ROW 1: Languages & Frameworks ═══════════════ -->
  
  <!-- Card 1: Languages -->
  <g class="card" style="animation-delay: 0.1s" transform="translate(20, 52)">
    <rect width="250" height="120" rx="6" fill="url(#cardGrad1)" stroke="#00f5d4" stroke-width="0.6" class="card-border"/>
    <!-- Header bar -->
    <rect width="250" height="26" rx="6" fill="#00f5d4" opacity="0.06"/>
    <rect y="13" width="250" height="13" fill="#00f5d4" opacity="0.06"/>
    <!-- Window dots -->
    <circle cx="14" cy="13" r="3" fill="#ff5f57" opacity="0.7"/>
    <circle cx="26" cy="13" r="3" fill="#febc2e" opacity="0.7"/>
    <circle cx="38" cy="13" r="3" fill="#28c840" opacity="0.7"/>
    <text x="125" y="17" text-anchor="middle" class="section-title" fill="#00f5d4" font-size="9" letter-spacing="3">LANGUAGES</text>
    
    <!-- Skills -->
    <g transform="translate(15, 42)">
      <circle cx="0" cy="0" r="2" fill="#00f5d4" class="skill-dot"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">Python</text>
      <rect x="90" y="-8" width="55" height="16" rx="3" fill="#00f5d4" opacity="0.08"/>
      <text x="117" y="3" text-anchor="middle" font-family="'Consolas',monospace" font-size="9" fill="#00f5d4">advanced</text>
    </g>
    <g transform="translate(15, 62)">
      <circle cx="0" cy="0" r="2" fill="#7b61ff" class="skill-dot" style="animation-delay: 0.3s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">Java</text>
      <rect x="90" y="-8" width="55" height="16" rx="3" fill="#7b61ff" opacity="0.08"/>
      <text x="117" y="3" text-anchor="middle" font-family="'Consolas',monospace" font-size="9" fill="#7b61ff">advanced</text>
    </g>
    <g transform="translate(15, 82)">
      <circle cx="0" cy="0" r="2" fill="#00f5d4" class="skill-dot" style="animation-delay: 0.6s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">C++</text>
      <rect x="90" y="-8" width="72" height="16" rx="3" fill="#00f5d4" opacity="0.08"/>
      <text x="126" y="3" text-anchor="middle" font-family="'Consolas',monospace" font-size="9" fill="#00f5d4">intermediate</text>
    </g>
    <g transform="translate(155, 42)">
      <circle cx="0" cy="0" r="2" fill="#7b61ff" class="skill-dot" style="animation-delay: 0.9s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">JavaScript</text>
    </g>
    <g transform="translate(155, 62)">
      <circle cx="0" cy="0" r="2" fill="#00f5d4" class="skill-dot" style="animation-delay: 1.2s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">SQL</text>
    </g>
    <g transform="translate(155, 82)">
      <circle cx="0" cy="0" r="2" fill="#7b61ff" class="skill-dot" style="animation-delay: 1.5s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">HTML/CSS</text>
    </g>
  </g>
  
  <!-- Card 2: Frameworks & Web -->
  <g class="card" style="animation-delay: 0.2s" transform="translate(290, 52)">
    <rect width="265" height="120" rx="6" fill="url(#cardGrad1)" stroke="#7b61ff" stroke-width="0.6" class="card-border"/>
    <rect width="265" height="26" rx="6" fill="#7b61ff" opacity="0.06"/>
    <rect y="13" width="265" height="13" fill="#7b61ff" opacity="0.06"/>
    <circle cx="14" cy="13" r="3" fill="#ff5f57" opacity="0.7"/>
    <circle cx="26" cy="13" r="3" fill="#febc2e" opacity="0.7"/>
    <circle cx="38" cy="13" r="3" fill="#28c840" opacity="0.7"/>
    <text x="132" y="17" text-anchor="middle" class="section-title" fill="#7b61ff" font-size="9" letter-spacing="3">FRAMEWORKS &amp; WEB</text>
    
    <g transform="translate(15, 42)">
      <circle cx="0" cy="0" r="2" fill="#7b61ff" class="skill-dot"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">React.js</text>
    </g>
    <g transform="translate(15, 62)">
      <circle cx="0" cy="0" r="2" fill="#00f5d4" class="skill-dot" style="animation-delay: 0.4s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">Next.js</text>
    </g>
    <g transform="translate(15, 82)">
      <circle cx="0" cy="0" r="2" fill="#7b61ff" class="skill-dot" style="animation-delay: 0.8s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">FastAPI</text>
    </g>
    <g transform="translate(135, 42)">
      <circle cx="0" cy="0" r="2" fill="#00f5d4" class="skill-dot" style="animation-delay: 0.2s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">Node.js</text>
    </g>
    <g transform="translate(135, 62)">
      <circle cx="0" cy="0" r="2" fill="#7b61ff" class="skill-dot" style="animation-delay: 0.6s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">Express.js</text>
    </g>
    <g transform="translate(135, 82)">
      <circle cx="0" cy="0" r="2" fill="#00f5d4" class="skill-dot" style="animation-delay: 1s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">MERN Stack</text>
    </g>
  </g>

  <!-- Card 3: AI & ML -->
  <g class="card" style="animation-delay: 0.3s" transform="translate(575, 52)">
    <rect width="255" height="120" rx="6" fill="url(#cardGrad1)" stroke="#00f5d4" stroke-width="0.6" class="card-border"/>
    <rect width="255" height="26" rx="6" fill="#00f5d4" opacity="0.06"/>
    <rect y="13" width="255" height="13" fill="#00f5d4" opacity="0.06"/>
    <circle cx="14" cy="13" r="3" fill="#ff5f57" opacity="0.7"/>
    <circle cx="26" cy="13" r="3" fill="#febc2e" opacity="0.7"/>
    <circle cx="38" cy="13" r="3" fill="#28c840" opacity="0.7"/>
    <text x="127" y="17" text-anchor="middle" class="section-title" fill="#00f5d4" font-size="9" letter-spacing="3">AI / ML / GEN AI</text>
    
    <g transform="translate(15, 42)">
      <circle cx="0" cy="0" r="2" fill="#00f5d4" class="skill-dot"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">RAG Pipelines</text>
    </g>
    <g transform="translate(15, 62)">
      <circle cx="0" cy="0" r="2" fill="#7b61ff" class="skill-dot" style="animation-delay: 0.5s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">LLM APIs</text>
    </g>
    <g transform="translate(15, 82)">
      <circle cx="0" cy="0" r="2" fill="#00f5d4" class="skill-dot" style="animation-delay: 1s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">Transformers</text>
    </g>
    <g transform="translate(135, 42)">
      <circle cx="0" cy="0" r="2" fill="#7b61ff" class="skill-dot" style="animation-delay: 0.3s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">Gemini API</text>
    </g>
    <g transform="translate(135, 62)">
      <circle cx="0" cy="0" r="2" fill="#00f5d4" class="skill-dot" style="animation-delay: 0.7s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">OpenCV</text>
    </g>
    <g transform="translate(135, 82)">
      <circle cx="0" cy="0" r="2" fill="#7b61ff" class="skill-dot" style="animation-delay: 1.2s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">Embeddings</text>
    </g>
  </g>
  
  <!-- ═══════════════ ROW 2: Data, Tools, Databases ═══════════════ -->

  <!-- Card 4: Data Science -->
  <g class="card" style="animation-delay: 0.4s" transform="translate(20, 185)">
    <rect width="250" height="115" rx="6" fill="url(#cardGrad1)" stroke="#7b61ff" stroke-width="0.6" class="card-border"/>
    <rect width="250" height="26" rx="6" fill="#7b61ff" opacity="0.06"/>
    <rect y="13" width="250" height="13" fill="#7b61ff" opacity="0.06"/>
    <circle cx="14" cy="13" r="3" fill="#ff5f57" opacity="0.7"/>
    <circle cx="26" cy="13" r="3" fill="#febc2e" opacity="0.7"/>
    <circle cx="38" cy="13" r="3" fill="#28c840" opacity="0.7"/>
    <text x="125" y="17" text-anchor="middle" class="section-title" fill="#7b61ff" font-size="9" letter-spacing="3">DATA SCIENCE</text>
    
    <g transform="translate(15, 42)">
      <circle cx="0" cy="0" r="2" fill="#7b61ff" class="skill-dot"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">Pandas</text>
    </g>
    <g transform="translate(15, 62)">
      <circle cx="0" cy="0" r="2" fill="#00f5d4" class="skill-dot" style="animation-delay: 0.4s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">NumPy</text>
    </g>
    <g transform="translate(15, 82)">
      <circle cx="0" cy="0" r="2" fill="#7b61ff" class="skill-dot" style="animation-delay: 0.8s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">Matplotlib</text>
    </g>
    <g transform="translate(135, 42)">
      <circle cx="0" cy="0" r="2" fill="#00f5d4" class="skill-dot" style="animation-delay: 0.2s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">Seaborn</text>
    </g>
    <g transform="translate(135, 62)">
      <circle cx="0" cy="0" r="2" fill="#7b61ff" class="skill-dot" style="animation-delay: 0.6s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">Streamlit</text>
    </g>
  </g>
  
  <!-- Card 5: Databases & Cloud -->
  <g class="card" style="animation-delay: 0.5s" transform="translate(290, 185)">
    <rect width="265" height="115" rx="6" fill="url(#cardGrad1)" stroke="#00f5d4" stroke-width="0.6" class="card-border"/>
    <rect width="265" height="26" rx="6" fill="#00f5d4" opacity="0.06"/>
    <rect y="13" width="265" height="13" fill="#00f5d4" opacity="0.06"/>
    <circle cx="14" cy="13" r="3" fill="#ff5f57" opacity="0.7"/>
    <circle cx="26" cy="13" r="3" fill="#febc2e" opacity="0.7"/>
    <circle cx="38" cy="13" r="3" fill="#28c840" opacity="0.7"/>
    <text x="132" y="17" text-anchor="middle" class="section-title" fill="#00f5d4" font-size="9" letter-spacing="3">DATABASES &amp; CLOUD</text>
    
    <g transform="translate(15, 42)">
      <circle cx="0" cy="0" r="2" fill="#00f5d4" class="skill-dot"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">MongoDB</text>
    </g>
    <g transform="translate(15, 62)">
      <circle cx="0" cy="0" r="2" fill="#7b61ff" class="skill-dot" style="animation-delay: 0.4s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">Redis</text>
    </g>
    <g transform="translate(15, 82)">
      <circle cx="0" cy="0" r="2" fill="#00f5d4" class="skill-dot" style="animation-delay: 0.8s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">Firebase</text>
    </g>
    <g transform="translate(135, 42)">
      <circle cx="0" cy="0" r="2" fill="#7b61ff" class="skill-dot" style="animation-delay: 0.3s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">SQL</text>
    </g>
    <g transform="translate(135, 62)">
      <circle cx="0" cy="0" r="2" fill="#00f5d4" class="skill-dot" style="animation-delay: 0.7s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">Qdrant</text>
    </g>
    <g transform="translate(135, 82)">
      <circle cx="0" cy="0" r="2" fill="#7b61ff" class="skill-dot" style="animation-delay: 1.1s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">AWS (Learning)</text>
    </g>
  </g>

  <!-- Card 6: Tools & Platforms -->
  <g class="card" style="animation-delay: 0.6s" transform="translate(575, 185)">
    <rect width="255" height="115" rx="6" fill="url(#cardGrad1)" stroke="#7b61ff" stroke-width="0.6" class="card-border"/>
    <rect width="255" height="26" rx="6" fill="#7b61ff" opacity="0.06"/>
    <rect y="13" width="255" height="13" fill="#7b61ff" opacity="0.06"/>
    <circle cx="14" cy="13" r="3" fill="#ff5f57" opacity="0.7"/>
    <circle cx="26" cy="13" r="3" fill="#febc2e" opacity="0.7"/>
    <circle cx="38" cy="13" r="3" fill="#28c840" opacity="0.7"/>
    <text x="127" y="17" text-anchor="middle" class="section-title" fill="#7b61ff" font-size="9" letter-spacing="3">TOOLS &amp; PLATFORMS</text>
    
    <g transform="translate(15, 42)">
      <circle cx="0" cy="0" r="2" fill="#7b61ff" class="skill-dot"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">Git / GitHub</text>
    </g>
    <g transform="translate(15, 62)">
      <circle cx="0" cy="0" r="2" fill="#00f5d4" class="skill-dot" style="animation-delay: 0.5s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">Docker</text>
    </g>
    <g transform="translate(15, 82)">
      <circle cx="0" cy="0" r="2" fill="#7b61ff" class="skill-dot" style="animation-delay: 1s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">VS Code</text>
    </g>
    <g transform="translate(135, 42)">
      <circle cx="0" cy="0" r="2" fill="#00f5d4" class="skill-dot" style="animation-delay: 0.3s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">Google ADK</text>
    </g>
    <g transform="translate(135, 62)">
      <circle cx="0" cy="0" r="2" fill="#7b61ff" class="skill-dot" style="animation-delay: 0.7s"/>
      <text x="10" y="4" class="skill-text" fill="#e6edf3">Postman</text>
    </g>
