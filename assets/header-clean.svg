<svg xmlns="http://www.w3.org/2000/svg" width="850" height="200" viewBox="0 0 850 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="50%" style="stop-color:#bc8cff"/>
      <stop offset="100%" style="stop-color:#58a6ff"/>
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.04"/>
      <stop offset="100%" style="stop-color:#bc8cff;stop-opacity:0.02"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    @keyframes shimmer { 0% { stop-color: #58a6ff; } 50% { stop-color: #bc8cff; } 100% { stop-color: #58a6ff; } }
    @keyframes cursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    
    .dot-live { animation: pulse 2s ease-in-out infinite; }
    .cursor-blink { animation: cursor 1s step-end infinite; }
    
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <!-- Background -->
  <rect width="850" height="200" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Subtle Blueprint Grid Lines -->
  <g opacity="0.06" stroke="#58a6ff" stroke-width="0.5">
    <line x1="0" y1="40" x2="850" y2="40"/>
    <line x1="0" y1="80" x2="850" y2="80"/>
    <line x1="0" y1="120" x2="850" y2="120"/>
    <line x1="0" y1="160" x2="850" y2="160"/>
    <line x1="170" y1="0" x2="170" y2="200"/>
    <line x1="340" y1="0" x2="340" y2="200"/>
    <line x1="510" y1="0" x2="510" y2="200"/>
    <line x1="680" y1="0" x2="680" y2="200"/>
  </g>

  <!-- Content Group -->
  <g transform="translate(45, 0)">
    <!-- Terminal Command Line -->
    <g transform="translate(0, 36)">
      <circle cx="0" cy="0" r="3.5" fill="#3fb950" class="dot-live"/>
      <text x="12" y="4" class="font-mono" font-size="12" fill="#7d8590">
        vijayaramanujam.dev ~ <tspan fill="#58a6ff">git status</tspan> (main)
      </text>
    </g>

    <!-- Main Name -->
    <g transform="translate(0, 85)">
      <text x="0" y="0" class="font-sans" font-size="38" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
        VIJAYARAMANUJAM N
      </text>
      <!-- Cursor -->
      <rect x="420" y="-30" width="3" height="34" fill="#58a6ff" class="cursor-blink"/>
    </g>

    <!-- Tagline -->
    <text x="0" y="118" class="font-mono" font-size="14" fill="#e6edf3" font-weight="500">
      Aspiring AI Developer <tspan fill="#6e7681">//</tspan> <tspan fill="#7d8590">Computer Science &amp; Engineering</tspan>
    </text>

    <!-- Institution and Specs -->
    <text x="0" y="148" class="font-mono" font-size="12" fill="#7d8590">
      📍 Chennai Institute of Technology <tspan fill="#30363d">|</tspan> CGPA: <tspan fill="#3fb950" font-weight="bold">9.52/10</tspan> <tspan fill="#30363d">|</tspan> LeetCode: <tspan fill="#d29922" font-weight="bold">564+ Solved</tspan> (Peak: 1738)
    </text>

    <!-- Decorative status line at bottom -->
    <line x1="0" y1="172" x2="760" y2="172" stroke="#21262d" stroke-width="1"/>
    <text x="0" y="186" class="font-mono" font-size="10" fill="#6e7681">
      ⚡ SPECIALIZATION: MULTI-AGENT AI · RAG PIPELINES · ENTERPRISE AUTOMATION
    </text>
  </g>
</svg>
