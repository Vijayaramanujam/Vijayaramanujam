<svg xmlns="http://www.w3.org/2000/svg" width="850" height="260" viewBox="0 0 850 260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0e1a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5d4;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00f5d4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00f5d4;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5d4"/>
      <stop offset="50%" style="stop-color:#7b61ff"/>
      <stop offset="100%" style="stop-color:#00f5d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes gridPulse {
      0%, 100% { opacity: 0.03; }
      50% { opacity: 0.08; }
    }
    @keyframes scanline {
      0% { transform: translateY(-260px); }
      100% { transform: translateY(260px); }
    }
    @keyframes typingCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(15px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes borderDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -40; }
    }
    @keyframes floatParticle1 {
      0%, 100% { transform: translate(0, 0); opacity: 0.3; }
      25% { transform: translate(10px, -15px); opacity: 0.7; }
      50% { transform: translate(-5px, -25px); opacity: 0.5; }
      75% { transform: translate(15px, -10px); opacity: 0.8; }
    }
    @keyframes floatParticle2 {
      0%, 100% { transform: translate(0, 0); opacity: 0.5; }
      33% { transform: translate(-12px, -20px); opacity: 0.8; }
      66% { transform: translate(8px, -30px); opacity: 0.3; }
    }
    @keyframes nodeGlow {
      0%, 100% { r: 2; opacity: 0.3; }
      50% { r: 4; opacity: 0.9; }
    }
    @keyframes lineShimmer {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .grid-line { animation: gridPulse 4s ease-in-out infinite; }
    .scanline { animation: scanline 8s linear infinite; }
    .cursor { animation: typingCursor 1s step-end infinite; }
    .name-text { animation: fadeSlideUp 1s ease-out forwards; }
    .tagline-text { animation: fadeSlideUp 1s ease-out 0.3s forwards; opacity: 0; }
    .sub-info { animation: fadeSlideUp 1s ease-out 0.6s forwards; opacity: 0; }
    .glow-dot { animation: glowPulse 2s ease-in-out infinite; }
    .border-anim { animation: borderDash 2s linear infinite; }
    .particle1 { animation: floatParticle1 6s ease-in-out infinite; }
    .particle2 { animation: floatParticle2 5s ease-in-out infinite; }
    .node-pulse { animation: nodeGlow 3s ease-in-out infinite; }
    .network-line { animation: lineShimmer 4s linear infinite; }
  </style>
  
  <!-- Background -->
  <rect width="850" height="260" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <g class="grid-line">
    <line x1="0" y1="40" x2="850" y2="40" stroke="#00f5d4" stroke-width="0.3" opacity="0.05"/>
    <line x1="0" y1="80" x2="850" y2="80" stroke="#00f5d4" stroke-width="0.3" opacity="0.05"/>
    <line x1="0" y1="120" x2="850" y2="120" stroke="#00f5d4" stroke-width="0.3" opacity="0.05"/>
    <line x1="0" y1="160" x2="850" y2="160" stroke="#00f5d4" stroke-width="0.3" opacity="0.05"/>
    <line x1="0" y1="200" x2="850" y2="200" stroke="#00f5d4" stroke-width="0.3" opacity="0.05"/>
    <line x1="0" y1="240" x2="850" y2="240" stroke="#00f5d4" stroke-width="0.3" opacity="0.05"/>
    <line x1="100" y1="0" x2="100" y2="260" stroke="#00f5d4" stroke-width="0.3" opacity="0.05"/>
    <line x1="200" y1="0" x2="200" y2="260" stroke="#00f5d4" stroke-width="0.3" opacity="0.05"/>
    <line x1="300" y1="0" x2="300" y2="260" stroke="#00f5d4" stroke-width="0.3" opacity="0.05"/>
    <line x1="400" y1="0" x2="400" y2="260" stroke="#00f5d4" stroke-width="0.3" opacity="0.05"/>
    <line x1="500" y1="0" x2="500" y2="260" stroke="#00f5d4" stroke-width="0.3" opacity="0.05"/>
    <line x1="600" y1="0" x2="600" y2="260" stroke="#00f5d4" stroke-width="0.3" opacity="0.05"/>
    <line x1="700" y1="0" x2="700" y2="260" stroke="#00f5d4" stroke-width="0.3" opacity="0.05"/>
    <line x1="800" y1="0" x2="800" y2="260" stroke="#00f5d4" stroke-width="0.3" opacity="0.05"/>
  </g>
  
  <!-- Neural network nodes (right side decoration) -->
  <g filter="url(#glow)">
    <!-- Layer 1 -->
    <circle cx="680" cy="60" r="3" fill="#00f5d4" class="node-pulse" style="animation-delay: 0s"/>
    <circle cx="680" cy="100" r="3" fill="#00f5d4" class="node-pulse" style="animation-delay: 0.5s"/>
    <circle cx="680" cy="140" r="3" fill="#00f5d4" class="node-pulse" style="animation-delay: 1s"/>
    <circle cx="680" cy="180" r="3" fill="#00f5d4" class="node-pulse" style="animation-delay: 1.5s"/>
    <!-- Layer 2 -->
    <circle cx="740" cy="80" r="3" fill="#7b61ff" class="node-pulse" style="animation-delay: 0.3s"/>
    <circle cx="740" cy="120" r="3" fill="#7b61ff" class="node-pulse" style="animation-delay: 0.8s"/>
    <circle cx="740" cy="160" r="3" fill="#7b61ff" class="node-pulse" style="animation-delay: 1.3s"/>
    <!-- Layer 3 -->
    <circle cx="800" cy="100" r="3" fill="#00f5d4" class="node-pulse" style="animation-delay: 0.6s"/>
    <circle cx="800" cy="140" r="3" fill="#00f5d4" class="node-pulse" style="animation-delay: 1.1s"/>
    
    <!-- Connections -->
    <line x1="680" y1="60" x2="740" y2="80" stroke="#00f5d4" stroke-width="0.5" opacity="0.2" class="network-line"/>
    <line x1="680" y1="60" x2="740" y2="120" stroke="#00f5d4" stroke-width="0.5" opacity="0.15" class="network-line" style="animation-delay: 0.5s"/>
    <line x1="680" y1="100" x2="740" y2="80" stroke="#00f5d4" stroke-width="0.5" opacity="0.2" class="network-line" style="animation-delay: 1s"/>
    <line x1="680" y1="100" x2="740" y2="120" stroke="#00f5d4" stroke-width="0.5" opacity="0.15" class="network-line" style="animation-delay: 1.5s"/>
    <line x1="680" y1="100" x2="740" y2="160" stroke="#00f5d4" stroke-width="0.5" opacity="0.2" class="network-line" style="animation-delay: 2s"/>
    <line x1="680" y1="140" x2="740" y2="120" stroke="#7b61ff" stroke-width="0.5" opacity="0.15" class="network-line" style="animation-delay: 0.3s"/>
    <line x1="680" y1="140" x2="740" y2="160" stroke="#7b61ff" stroke-width="0.5" opacity="0.2" class="network-line" style="animation-delay: 0.8s"/>
    <line x1="680" y1="180" x2="740" y2="160" stroke="#00f5d4" stroke-width="0.5" opacity="0.15" class="network-line" style="animation-delay: 1.3s"/>
    <line x1="740" y1="80" x2="800" y2="100" stroke="#7b61ff" stroke-width="0.5" opacity="0.2" class="network-line" style="animation-delay: 0.6s"/>
    <line x1="740" y1="120" x2="800" y2="100" stroke="#7b61ff" stroke-width="0.5" opacity="0.15" class="network-line" style="animation-delay: 1.1s"/>
    <line x1="740" y1="120" x2="800" y2="140" stroke="#00f5d4" stroke-width="0.5" opacity="0.2" class="network-line" style="animation-delay: 0.4s"/>
    <line x1="740" y1="160" x2="800" y2="140" stroke="#00f5d4" stroke-width="0.5" opacity="0.15" class="network-line" style="animation-delay: 0.9s"/>
  </g>

  <!-- Floating particles -->
  <circle cx="120" cy="50" r="1.5" fill="#00f5d4" class="particle1" opacity="0.5"/>
  <circle cx="350" cy="30" r="1" fill="#7b61ff" class="particle2" opacity="0.4"/>
  <circle cx="550" cy="220" r="1.5" fill="#00f5d4" class="particle1" style="animation-delay: 2s" opacity="0.3"/>
  <circle cx="780" cy="210" r="1" fill="#7b61ff" class="particle2" style="animation-delay: 1s" opacity="0.5"/>
  <circle cx="250" cy="240" r="1" fill="#00f5d4" class="particle1" style="animation-delay: 3s" opacity="0.4"/>
  
  <!-- Scanline effect -->
  <rect class="scanline" x="0" y="0" width="850" height="4" fill="url(#glowCyan)" opacity="0.03"/>

  <!-- Terminal bracket decoration (left) -->
  <g filter="url(#glow)">
    <text x="30" y="85" font-family="'Consolas','Monaco','Courier New',monospace" font-size="50" fill="#00f5d4" opacity="0.15">{</text>
  </g>
  
  <!-- Terminal prompt prefix -->
  <text x="50" y="80" font-family="'Consolas','Monaco','Courier New',monospace" font-size="12" fill="#00f5d4" opacity="0.6" filter="url(#glow)">
    ~/vijayaramanujam $
  </text>

  <!-- Main Name -->
  <g class="name-text" filter="url(#glowStrong)">
    <text x="50" y="125" font-family="'Segoe UI','Helvetica Neue','Arial',sans-serif" font-size="42" font-weight="800" fill="url(#nameGrad)" letter-spacing="2">
      VIJAYARAMANUJAM
    </text>
  </g>

  <!-- Typing cursor after name -->
  <rect class="cursor" x="530" y="100" width="3" height="32" fill="#00f5d4" filter="url(#glow)"/>

  <!-- Tagline -->
  <g class="tagline-text">
    <text x="52" y="158" font-family="'Consolas','Monaco','Courier New',monospace" font-size="15" fill="#c9d1d9" letter-spacing="1">
      Computer Science Student
    </text>
    <text x="300" y="158" font-family="'Consolas','Monaco','Courier New',monospace" font-size="15" fill="#484f58">
      //
    </text>
    <text x="325" y="158" font-family="'Consolas','Monaco','Courier New',monospace" font-size="15" fill="#7b61ff" filter="url(#glow)">
      Aspiring AI Developer
    </text>
  </g>
  
  <!-- Sub info -->
  <g class="sub-info">
    <!-- Status indicator -->
    <circle cx="58" cy="190" r="4" fill="#00f5d4" class="glow-dot" filter="url(#glow)"/>
    <text x="70" y="194" font-family="'Consolas','Monaco','Courier New',monospace" font-size="12" fill="#8b949e">
      Chennai Institute of Technology  |  CGPA: 9.52  |  564+ LeetCode Problems
    </text>
    
    <!-- Decorative line -->
    <line x1="50" y1="210" x2="620" y2="210" stroke="#00f5d4" stroke-width="0.5" opacity="0.15"/>
    
    <!-- Bottom tags -->
    <g transform="translate(50, 230)">
      <rect x="0" y="0" width="100" height="22" rx="4" fill="none" stroke="#00f5d4" stroke-width="0.8" opacity="0.4" class="border-anim" stroke-dasharray="5,5"/>
      <text x="50" y="15" font-family="'Consolas','Monaco','Courier New',monospace" font-size="10" fill="#00f5d4" text-anchor="middle" opacity="0.8">AI / ML</text>
      
      <rect x="115" y="0" width="100" height="22" rx="4" fill="none" stroke="#7b61ff" stroke-width="0.8" opacity="0.4" class="border-anim" stroke-dasharray="5,5"/>
      <text x="165" y="15" font-family="'Consolas','Monaco','Courier New',monospace" font-size="10" fill="#7b61ff" text-anchor="middle" opacity="0.8">Full Stack</text>
      
      <rect x="230" y="0" width="120" height="22" rx="4" fill="none" stroke="#00f5d4" stroke-width="0.8" opacity="0.4" class="border-anim" stroke-dasharray="5,5"/>
      <text x="290" y="15" font-family="'Consolas','Monaco','Courier New',monospace" font-size="10" fill="#00f5d4" text-anchor="middle" opacity="0.8">Open Source</text>
      
      <rect x="365" y="0" width="140" height="22" rx="4" fill="none" stroke="#7b61ff" stroke-width="0.8" opacity="0.4" class="border-anim" stroke-dasharray="5,5"/>
      <text x="435" y="15" font-family="'Consolas','Monaco','Courier New',monospace" font-size="10" fill="#7b61ff" text-anchor="middle" opacity="0.8">Hackathon Winner</text>
    </g>
  </g>
  
  <!-- Outer frame with animated border -->
  <rect x="2" y="2" width="846" height="256" rx="8" fill="none" stroke="#00f5d4" stroke-width="0.5" opacity="0.15"/>
  <rect x="6" y="6" width="838" height="248" rx="6" fill="none" stroke="#7b61ff" stroke-width="0.3" opacity="0.08"/>
</svg>
