<svg xmlns="http://www.w3.org/2000/svg" width="850" height="280" viewBox="0 0 850 280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020515"/>
      <stop offset="30%" style="stop-color:#0a0e27"/>
      <stop offset="70%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#050a18"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5d4"/>
      <stop offset="30%" style="stop-color:#00d4ff"/>
      <stop offset="60%" style="stop-color:#7b61ff"/>
      <stop offset="100%" style="stop-color:#ff61d4"/>
    </linearGradient>
    <linearGradient id="nameGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff61d4"/>
      <stop offset="50%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#00f5d4"/>
    </linearGradient>
    <radialGradient id="orbGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00f5d4;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#00f5d4;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7b61ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7b61ff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orbGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff61d4;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#ff61d4;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow2"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow3"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="isoFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5d4;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#00f5d4;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes gridPulse { 0%,100%{opacity:0.02} 50%{opacity:0.07} }
    @keyframes scanline { 0%{transform:translateY(-280px)} 100%{transform:translateY(280px)} }
    @keyframes cursor { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes fadeUp { 0%{opacity:0;transform:translateY(18px)} 100%{opacity:1;transform:translateY(0)} }
    @keyframes glowPulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
    @keyframes borderDash { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:-40} }
    @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(8px,-12px)} }
    @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-10px,-18px)} }
    @keyframes orbFloat { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(15px,-10px) scale(1.1)} 66%{transform:translate(-8px,5px) scale(0.95)} }
    @keyframes orbFloat2 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(-12px,8px) scale(0.9)} 66%{transform:translate(10px,-15px) scale(1.05)} }
    @keyframes rotateOrbit { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    @keyframes nodeGlow { 0%,100%{r:2;opacity:0.2} 50%{r:5;opacity:1} }
    @keyframes lineFlow { 0%{stroke-dashoffset:30} 100%{stroke-dashoffset:0} }
    @keyframes shimmer { 0%{opacity:0.5} 50%{opacity:1} 100%{opacity:0.5} }
    @keyframes cubeFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @keyframes starTwinkle { 0%,100%{opacity:0.1;r:0.5} 50%{opacity:0.8;r:1.2} }
    @keyframes hexRotate { 0%{transform:rotate(0deg)} 100%{transform:rotate(60deg)} }
    .grid{animation:gridPulse 4s ease-in-out infinite}
    .scan{animation:scanline 10s linear infinite}
    .cur{animation:cursor 1s step-end infinite}
    .f1{animation:fadeUp 0.8s ease-out forwards}
    .f2{animation:fadeUp 0.8s ease-out 0.25s forwards;opacity:0}
    .f3{animation:fadeUp 0.8s ease-out 0.5s forwards;opacity:0}
    .gd{animation:glowPulse 2s ease-in-out infinite}
    .bd{animation:borderDash 2s linear infinite}
    .fl1{animation:float1 5s ease-in-out infinite}
    .fl2{animation:float2 6s ease-in-out infinite}
    .orb1{animation:orbFloat 8s ease-in-out infinite}
    .orb2{animation:orbFloat2 7s ease-in-out infinite}
    .nd{animation:nodeGlow 3s ease-in-out infinite}
    .lf{animation:lineFlow 3s linear infinite}
    .sh{animation:shimmer 2s ease-in-out infinite}
    .cf{animation:cubeFloat 4s ease-in-out infinite}
    .st{animation:starTwinkle 3s ease-in-out infinite}
  </style>

  <!-- Background -->
  <rect width="850" height="280" fill="url(#bgGrad)"/>

  <!-- Star field -->
  <g>
    <circle cx="45" cy="25" r="0.8" fill="#fff" class="st"/>
    <circle cx="130" cy="55" r="0.5" fill="#fff" class="st" style="animation-delay:0.5s"/>
    <circle cx="250" cy="18" r="0.7" fill="#00d4ff" class="st" style="animation-delay:1s"/>
    <circle cx="380" cy="40" r="0.5" fill="#fff" class="st" style="animation-delay:1.5s"/>
    <circle cx="520" cy="15" r="0.8" fill="#7b61ff" class="st" style="animation-delay:0.3s"/>
    <circle cx="600" cy="50" r="0.5" fill="#fff" class="st" style="animation-delay:0.8s"/>
    <circle cx="720" cy="22" r="0.6" fill="#00f5d4" class="st" style="animation-delay:1.2s"/>
    <circle cx="790" cy="45" r="0.5" fill="#fff" class="st" style="animation-delay:0.6s"/>
    <circle cx="90" cy="260" r="0.5" fill="#fff" class="st" style="animation-delay:2s"/>
    <circle cx="460" cy="265" r="0.7" fill="#00d4ff" class="st" style="animation-delay:1.8s"/>
    <circle cx="680" cy="255" r="0.5" fill="#fff" class="st" style="animation-delay:0.9s"/>
    <circle cx="820" cy="270" r="0.6" fill="#7b61ff" class="st" style="animation-delay:1.4s"/>
    <circle cx="300" cy="270" r="0.5" fill="#ff61d4" class="st" style="animation-delay:2.2s"/>
  </g>

  <!-- Grid -->
  <g class="grid">
    <line x1="0" y1="40" x2="850" y2="40" stroke="#00f5d4" stroke-width="0.3" opacity="0.04"/>
    <line x1="0" y1="80" x2="850" y2="80" stroke="#00f5d4" stroke-width="0.3" opacity="0.04"/>
    <line x1="0" y1="120" x2="850" y2="120" stroke="#00f5d4" stroke-width="0.3" opacity="0.04"/>
    <line x1="0" y1="160" x2="850" y2="160" stroke="#00f5d4" stroke-width="0.3" opacity="0.04"/>
    <line x1="0" y1="200" x2="850" y2="200" stroke="#00f5d4" stroke-width="0.3" opacity="0.04"/>
    <line x1="0" y1="240" x2="850" y2="240" stroke="#00f5d4" stroke-width="0.3" opacity="0.04"/>
    <line x1="106" y1="0" x2="106" y2="280" stroke="#00f5d4" stroke-width="0.3" opacity="0.04"/>
    <line x1="212" y1="0" x2="212" y2="280" stroke="#00f5d4" stroke-width="0.3" opacity="0.04"/>
    <line x1="318" y1="0" x2="318" y2="280" stroke="#00f5d4" stroke-width="0.3" opacity="0.04"/>
    <line x1="425" y1="0" x2="425" y2="280" stroke="#00f5d4" stroke-width="0.3" opacity="0.04"/>
    <line x1="531" y1="0" x2="531" y2="280" stroke="#00f5d4" stroke-width="0.3" opacity="0.04"/>
    <line x1="637" y1="0" x2="637" y2="280" stroke="#00f5d4" stroke-width="0.3" opacity="0.04"/>
    <line x1="743" y1="0" x2="743" y2="280" stroke="#00f5d4" stroke-width="0.3" opacity="0.04"/>
  </g>

  <!-- Glowing orbs (background depth) -->
  <circle cx="120" cy="80" r="80" fill="url(#orbGlow1)" class="orb1"/>
  <circle cx="700" cy="180" r="100" fill="url(#orbGlow2)" class="orb2"/>
  <circle cx="400" cy="250" r="60" fill="url(#orbGlow3)" class="orb1" style="animation-delay:3s"/>

  <!-- 3D Isometric cubes (right side) -->
  <g transform="translate(650, 55)" class="cf">
    <!-- Cube 1 - top -->
    <polygon points="30,0 60,15 30,30 0,15" fill="#00f5d4" opacity="0.12"/>
    <polygon points="0,15 30,30 30,55 0,40" fill="#00f5d4" opacity="0.08"/>
    <polygon points="30,30 60,15 60,40 30,55" fill="#00f5d4" opacity="0.05"/>
    <polygon points="30,0 60,15 30,30 0,15" fill="none" stroke="#00f5d4" stroke-width="0.6" opacity="0.4"/>
    <polygon points="0,15 30,30 30,55 0,40" fill="none" stroke="#00f5d4" stroke-width="0.6" opacity="0.3"/>
    <polygon points="30,30 60,15 60,40 30,55" fill="none" stroke="#00f5d4" stroke-width="0.6" opacity="0.2"/>
  </g>
  <g transform="translate(710, 80)" class="cf" style="animation-delay:1s">
    <polygon points="25,0 50,12 25,25 0,12" fill="#7b61ff" opacity="0.12"/>
    <polygon points="0,12 25,25 25,45 0,32" fill="#7b61ff" opacity="0.08"/>
    <polygon points="25,25 50,12 50,32 25,45" fill="#7b61ff" opacity="0.05"/>
    <polygon points="25,0 50,12 25,25 0,12" fill="none" stroke="#7b61ff" stroke-width="0.6" opacity="0.4"/>
    <polygon points="0,12 25,25 25,45 0,32" fill="none" stroke="#7b61ff" stroke-width="0.6" opacity="0.3"/>
    <polygon points="25,25 50,12 50,32 25,45" fill="none" stroke="#7b61ff" stroke-width="0.6" opacity="0.2"/>
  </g>
  <g transform="translate(670, 110)" class="cf" style="animation-delay:2s">
    <polygon points="20,0 40,10 20,20 0,10" fill="#ff61d4" opacity="0.1"/>
    <polygon points="0,10 20,20 20,35 0,25" fill="#ff61d4" opacity="0.07"/>
    <polygon points="20,20 40,10 40,25 20,35" fill="none" stroke="#ff61d4" stroke-width="0.5" opacity="0.3"/>
    <polygon points="20,0 40,10 20,20 0,10" fill="none" stroke="#ff61d4" stroke-width="0.5" opacity="0.35"/>
    <polygon points="0,10 20,20 20,35 0,25" fill="none" stroke="#ff61d4" stroke-width="0.5" opacity="0.25"/>
  </g>

  <!-- 3D Neural network (right side, enhanced) -->
  <g filter="url(#glow)">
    <circle cx="740" cy="170" r="3" fill="#00f5d4" class="nd"/>
    <circle cx="740" cy="200" r="3" fill="#00f5d4" class="nd" style="animation-delay:0.5s"/>
    <circle cx="740" cy="230" r="3" fill="#00f5d4" class="nd" style="animation-delay:1s"/>
    <circle cx="785" cy="180" r="3.5" fill="#7b61ff" class="nd" style="animation-delay:0.3s"/>
    <circle cx="785" cy="215" r="3.5" fill="#7b61ff" class="nd" style="animation-delay:0.8s"/>
    <circle cx="825" cy="197" r="4" fill="#ff61d4" class="nd" style="animation-delay:0.6s"/>
    <line x1="740" y1="170" x2="785" y2="180" stroke="#00f5d4" stroke-width="0.6" opacity="0.3" stroke-dasharray="4,3" class="lf"/>
    <line x1="740" y1="170" x2="785" y2="215" stroke="#00d4ff" stroke-width="0.4" opacity="0.2" stroke-dasharray="4,3" class="lf" style="animation-delay:0.5s"/>
    <line x1="740" y1="200" x2="785" y2="180" stroke="#7b61ff" stroke-width="0.5" opacity="0.25" stroke-dasharray="4,3" class="lf" style="animation-delay:1s"/>
    <line x1="740" y1="200" x2="785" y2="215" stroke="#00f5d4" stroke-width="0.6" opacity="0.3" stroke-dasharray="4,3" class="lf" style="animation-delay:1.5s"/>
    <line x1="740" y1="230" x2="785" y2="215" stroke="#7b61ff" stroke-width="0.4" opacity="0.2" stroke-dasharray="4,3" class="lf" style="animation-delay:0.3s"/>
    <line x1="785" y1="180" x2="825" y2="197" stroke="#ff61d4" stroke-width="0.6" opacity="0.3" stroke-dasharray="4,3" class="lf" style="animation-delay:0.7s"/>
    <line x1="785" y1="215" x2="825" y2="197" stroke="#ff61d4" stroke-width="0.5" opacity="0.25" stroke-dasharray="4,3" class="lf" style="animation-delay:1.2s"/>
  </g>

  <!-- Floating hexagons (left decorations) -->
  <g transform="translate(30, 180)" opacity="0.15" class="fl1">
    <polygon points="15,0 28,8 28,23 15,30 2,23 2,8" fill="none" stroke="#00f5d4" stroke-width="0.8"/>
  </g>
  <g transform="translate(60, 210)" opacity="0.1" class="fl2">
    <polygon points="10,0 18,5 18,15 10,20 2,15 2,5" fill="none" stroke="#7b61ff" stroke-width="0.6"/>
  </g>
  <g transform="translate(15, 230)" opacity="0.08" class="fl1" style="animation-delay:2s">
    <polygon points="8,0 14,4 14,12 8,16 2,12 2,4" fill="none" stroke="#ff61d4" stroke-width="0.5"/>
  </g>

  <!-- Scanline -->
  <rect class="scan" x="0" y="0" width="850" height="3" fill="#00f5d4" opacity="0.02"/>

  <!-- Terminal prompt -->
  <g class="f1">
    <text x="50" y="72" font-family="'Consolas','Monaco','Courier New',monospace" font-size="11" fill="#00f5d4" opacity="0.5" filter="url(#glow)">
      ~/vijayaramanujam $&gt; init --profile
    </text>
  </g>

  <!-- Main Name with multi-gradient -->
  <g class="f1" filter="url(#glow2)">
    <text x="50" y="120" font-family="'Segoe UI','Helvetica Neue','Arial',sans-serif" font-size="46" font-weight="900" fill="url(#nameGrad)" letter-spacing="3">
      VIJAYARAMANUJAM
    </text>
  </g>
  <!-- Ghost/reflection of name -->
  <g class="f1" opacity="0.06">
    <text x="50" y="145" font-family="'Segoe UI','Helvetica Neue','Arial',sans-serif" font-size="46" font-weight="900" fill="url(#nameGrad2)" letter-spacing="3" transform="scale(1,-0.3) translate(0,-490)">
      VIJAYARAMANUJAM
    </text>
  </g>

  <!-- Typing cursor -->
  <rect class="cur" x="558" y="93" width="3" height="34" fill="#00f5d4" filter="url(#glow)"/>

  <!-- Tagline -->
  <g class="f2">
    <text x="52" y="155" font-family="'Consolas','Monaco','Courier New',monospace" font-size="15" fill="#c9d1d9" letter-spacing="1">
      Computer Science Student
    </text>
    <text x="300" y="155" font-family="'Consolas','Monaco','Courier New',monospace" font-size="15" fill="#484f58"> | </text>
    <text x="322" y="155" font-family="'Consolas','Monaco','Courier New',monospace" font-size="15" fill="#7b61ff" filter="url(#glow)">
      Aspiring AI Developer
    </text>
    <text x="547" y="155" font-family="'Consolas','Monaco','Courier New',monospace" font-size="15" fill="#484f58"> | </text>
    <text x="569" y="155" font-family="'Consolas','Monaco','Courier New',monospace" font-size="15" fill="#ff61d4" filter="url(#glow)">
      Builder
    </text>
  </g>

  <!-- Status line -->
  <g class="f3">
    <circle cx="58" cy="185" r="4" fill="#00f5d4" class="gd" filter="url(#glow)"/>
    <text x="70" y="189" font-family="'Consolas','Monaco','Courier New',monospace" font-size="11" fill="#8b949e">
      CIT Chennai  &#x2022;  CGPA 9.52  &#x2022;  564+ LeetCode  &#x2022;  Hackathon Winner  &#x2022;  Open Source
    </text>

    <!-- Separator -->
    <line x1="50" y1="203" x2="630" y2="203" stroke="url(#nameGrad)" stroke-width="0.5" opacity="0.2"/>

    <!-- Tags with colored borders -->
    <g transform="translate(50, 215)">
      <rect x="0" y="0" width="70" height="22" rx="11" fill="#00f5d4" opacity="0.08"/>
      <rect x="0" y="0" width="70" height="22" rx="11" fill="none" stroke="#00f5d4" stroke-width="0.7" opacity="0.5"/>
      <text x="35" y="15" font-family="'Consolas',monospace" font-size="9" fill="#00f5d4" text-anchor="middle">AI / ML</text>

      <rect x="82" y="0" width="85" height="22" rx="11" fill="#7b61ff" opacity="0.08"/>
      <rect x="82" y="0" width="85" height="22" rx="11" fill="none" stroke="#7b61ff" stroke-width="0.7" opacity="0.5"/>
      <text x="124" y="15" font-family="'Consolas',monospace" font-size="9" fill="#7b61ff" text-anchor="middle">Full Stack</text>

      <rect x="179" y="0" width="65" height="22" rx="11" fill="#ff61d4" opacity="0.08"/>
      <rect x="179" y="0" width="65" height="22" rx="11" fill="none" stroke="#ff61d4" stroke-width="0.7" opacity="0.5"/>
      <text x="211" y="15" font-family="'Consolas',monospace" font-size="9" fill="#ff61d4" text-anchor="middle">GenAI</text>

      <rect x="256" y="0" width="90" height="22" rx="11" fill="#00d4ff" opacity="0.08"/>
      <rect x="256" y="0" width="90" height="22" rx="11" fill="none" stroke="#00d4ff" stroke-width="0.7" opacity="0.5"/>
      <text x="301" y="15" font-family="'Consolas',monospace" font-size="9" fill="#00d4ff" text-anchor="middle">LeetCode</text>

      <rect x="358" y="0" width="110" height="22" rx="11" fill="#00f5d4" opacity="0.08"/>
      <rect x="358" y="0" width="110" height="22" rx="11" fill="none" stroke="#00f5d4" stroke-width="0.7" opacity="0.5" stroke-dasharray="4,3" class="bd"/>
      <text x="413" y="15" font-family="'Consolas',monospace" font-size="9" fill="#00f5d4" text-anchor="middle">Open Source</text>
    </g>
  </g>

  <!-- Outer frame -->
  <rect x="1" y="1" width="848" height="278" rx="10" fill="none" stroke="#00f5d4" stroke-width="0.4" opacity="0.12"/>
  <rect x="4" y="4" width="842" height="272" rx="8" fill="none" stroke="#7b61ff" stroke-width="0.2" opacity="0.06"/>
</svg>
