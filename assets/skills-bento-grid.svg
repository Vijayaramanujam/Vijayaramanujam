      <text x="38" y="32" class="font-mono" font-size="9" fill="#f472b6">REACT · FASTAPI · NEXT.JS</text>
    </g>

    <g transform="translate(18, 66)">
      <!-- Row 1 -->
      <g>
        <rect width="92" height="24" rx="12" fill="url(#glowPillPink)" stroke="#f472b6" stroke-width="0.8" stroke-opacity="0.6"/>
        <text x="10" y="16" class="font-sans" font-size="10.5" font-weight="600" fill="#fdf2f8">⚛️ React.js</text>
      </g>
      <g transform="translate(100, 0)">
        <rect width="86" height="24" rx="12" fill="url(#glowPillPink)" stroke="#f472b6" stroke-width="0.8" stroke-opacity="0.6"/>
        <text x="10" y="16" class="font-sans" font-size="10.5" font-weight="600" fill="#fdf2f8">⚡ FastAPI</text>
      </g>
      <g transform="translate(194, 0)">
        <rect width="84" height="24" rx="12" fill="url(#glowPillPink)" stroke="#f472b6" stroke-width="0.8" stroke-opacity="0.6"/>
        <text x="10" y="16" class="font-sans" font-size="10.5" font-weight="600" fill="#fdf2f8">▲ Next.js</text>
      </g>
      <g transform="translate(286, 0)">
        <rect width="42" height="24" rx="12" fill="url(#glowPillPink)" stroke="#f472b6" stroke-width="0.8" stroke-opacity="0.6"/>
        <text x="8" y="16" class="font-sans" font-size="10.5" font-weight="600" fill="#fdf2f8">API</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 32)">
        <rect width="94" height="24" rx="12" fill="url(#glowPillPink)" stroke="#f472b6" stroke-width="0.8" stroke-opacity="0.6"/>
        <text x="10" y="16" class="font-sans" font-size="10.5" font-weight="600" fill="#fdf2f8">📦 Node.js</text>
      </g>
      <g transform="translate(102, 32)">
        <rect width="96" height="24" rx="12" fill="url(#glowPillPink)" stroke="#f472b6" stroke-width="0.8" stroke-opacity="0.6"/>
        <text x="10" y="16" class="font-sans" font-size="10.5" font-weight="600" fill="#fdf2f8">🔥 Streamlit</text>
      </g>
      <g transform="translate(206, 32)">
        <rect width="122" height="24" rx="12" fill="url(#glowPillPink)" stroke="#f472b6" stroke-width="0.8" stroke-opacity="0.6"/>
        <text x="10" y="16" class="font-sans" font-size="10.5" font-weight="600" fill="#fdf2f8">🛠️ REST APIs</text>
      </g>
    </g>
  </g>

  <!-- TILE 4: DATA SCIENCE & CLOUD (Bottom-Right) -->
