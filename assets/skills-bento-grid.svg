    <rect width="365" height="155" rx="12" fill="url(#cardBg)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.5"/>
    
    <g transform="translate(18, 20)">
      <rect width="28" height="28" rx="6" fill="#022c22" stroke="#34d399" stroke-width="0.8"/>
      <text x="14" y="19" font-size="15" text-anchor="middle">☁️</text>
      <text x="38" y="18" class="font-sans" font-size="14" font-weight="700" fill="#ffffff">Data Science &amp; Cloud</text>
      <text x="38" y="32" class="font-mono" font-size="9" fill="#34d399">PANDAS · QDRANT · AWS</text>
    </g>

    <g transform="translate(18, 66)">
      <!-- Row 1 -->
      <g>
        <rect width="92" height="24" rx="12" fill="url(#glowPillGreen)" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.6"/>
        <text x="10" y="16" class="font-sans" font-size="10.5" font-weight="600" fill="#ecfdf5">🐼 Pandas</text>
      </g>
      <g transform="translate(100, 0)">
        <rect width="84" height="24" rx="12" fill="url(#glowPillGreen)" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.6"/>
        <text x="10" y="16" class="font-sans" font-size="10.5" font-weight="600" fill="#ecfdf5">🔢 NumPy</text>
      </g>
      <g transform="translate(192, 0)">
        <rect width="136" height="24" rx="12" fill="url(#glowPillGreen)" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.6"/>
        <text x="10" y="16" class="font-sans" font-size="10.5" font-weight="600" fill="#ecfdf5">🔴 Qdrant Vector</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 32)">
        <rect width="98" height="24" rx="12" fill="url(#glowPillGreen)" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.6"/>
        <text x="10" y="16" class="font-sans" font-size="10.5" font-weight="600" fill="#ecfdf5">🍃 MongoDB</text>
      </g>
      <g transform="translate(106, 32)">
        <rect width="84" height="24" rx="12" fill="url(#glowPillGreen)" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.6"/>
        <text x="10" y="16" class="font-sans" font-size="10.5" font-weight="600" fill="#ecfdf5">🐳 Docker</text>
      </g>
      <g transform="translate(198, 32)">
        <rect width="130" height="24" rx="12" fill="url(#glowPillGreen)" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.6"/>
        <text x="10" y="16" class="font-sans" font-size="10.5" font-weight="600" fill="#ecfdf5">☁️ AWS (Learning)</text>
      </g>
    </g>
  </g>
</svg>
