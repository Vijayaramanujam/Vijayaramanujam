      <g transform="translate(0, 32)">
        <rect width="108" height="24" rx="12" fill="url(#glowPillCyan)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6"/>
        <text x="10" y="16" class="font-sans" font-size="10.5" font-weight="600" fill="#e0f2fe">🌐 JavaScript</text>
      </g>
      <g transform="translate(116, 32)">
        <rect width="112" height="24" rx="12" fill="url(#glowPillCyan)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6"/>
        <text x="10" y="16" class="font-sans" font-size="10.5" font-weight="600" fill="#e0f2fe">🧩 Algorithms</text>
      </g>
      <g transform="translate(236, 32)">
        <rect width="92" height="24" rx="12" fill="url(#glowPillCyan)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6"/>
        <text x="10" y="16" class="font-sans" font-size="10.5" font-weight="600" fill="#e0f2fe">🏆 Contest</text>
      </g>
    </g>
  </g>

