<svg xmlns="http://www.w3.org/2000/svg" width="850" height="220" viewBox="0 0 850 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020515"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/></filter>
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#00f5d4;stop-opacity:0.2"/><stop offset="100%" style="stop-color:#00f5d4;stop-opacity:0.8"/></linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#7b61ff;stop-opacity:0.2"/><stop offset="100%" style="stop-color:#7b61ff;stop-opacity:0.8"/></linearGradient>
    <linearGradient id="bar3" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#ff61d4;stop-opacity:0.2"/><stop offset="100%" style="stop-color:#ff61d4;stop-opacity:0.8"/></linearGradient>
    <linearGradient id="bar4" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.2"/><stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.8"/></linearGradient>
  </defs>
  <style>
    @keyframes growUp { 0%{transform:scaleY(0)} 100%{transform:scaleY(1)} }
    @keyframes countUp { 0%{opacity:0} 100%{opacity:1} }
    @keyframes shimmer { 0%,100%{opacity:0.7} 50%{opacity:1} }
    @keyframes cubeFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
    .grow{animation:growUp 1.5s ease-out forwards;transform-origin:bottom}
    .num{animation:countUp 0.8s ease-out forwards}
    .sh{animation:shimmer 2.5s ease-in-out infinite}
    .cf{animation:cubeFloat 3s ease-in-out infinite}
    .pl{animation:pulse 2s ease-in-out infinite}
  </style>

  <rect width="850" height="220" fill="url(#bg)"/>

  <!-- Title -->
  <text x="425" y="25" text-anchor="middle" font-family="'Consolas',monospace" font-size="11" fill="#00f5d4" letter-spacing="4" filter="url(#glow)">
    &#x276E; STATS &amp; ACHIEVEMENTS &#x276F;
  </text>
  <line x1="120" y1="35" x2="730" y2="35" stroke="#00f5d4" stroke-width="0.3" opacity="0.15"/>

  <!-- ═══ 3D ISOMETRIC BAR CHART ═══ -->
  <g transform="translate(50, 185)">
    <!-- Floor grid -->
    <g opacity="0.06">
      <line x1="0" y1="0" x2="350" y2="0" stroke="#00f5d4" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="30" y2="-15" stroke="#00f5d4" stroke-width="0.5"/>
      <line x1="70" y1="0" x2="100" y2="-15" stroke="#00f5d4" stroke-width="0.5"/>
      <line x1="140" y1="0" x2="170" y2="-15" stroke="#00f5d4" stroke-width="0.5"/>
      <line x1="210" y1="0" x2="240" y2="-15" stroke="#00f5d4" stroke-width="0.5"/>
      <line x1="280" y1="0" x2="310" y2="-15" stroke="#00f5d4" stroke-width="0.5"/>
      <line x1="350" y1="0" x2="380" y2="-15" stroke="#00f5d4" stroke-width="0.5"/>
    </g>

    <!-- Bar 1: LeetCode (564+) -->
    <g class="cf">
      <!-- Front face -->
      <rect x="15" y="-120" width="40" height="120" fill="url(#bar1)" class="grow" style="animation-delay:0.1s" rx="2"/>
      <rect x="15" y="-120" width="40" height="120" fill="none" stroke="#00f5d4" stroke-width="0.6" opacity="0.5" class="grow" style="animation-delay:0.1s" rx="2"/>
      <!-- Top face (3D) -->
      <polygon points="15,-120 55,-120 75,-132 35,-132" fill="#00f5d4" opacity="0.25"/>
      <!-- Right face (3D) -->
      <polygon points="55,-120 75,-132 75,-12 55,0" fill="#00f5d4" opacity="0.1"/>
      <!-- Label -->
      <text x="35" y="15" text-anchor="middle" font-family="'Consolas',monospace" font-size="8" fill="#8b949e">LeetCode</text>
      <text x="35" y="-128" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="13" fill="#00f5d4" font-weight="700" filter="url(#glow)" class="num" style="animation-delay:0.5s">564+</text>
    </g>

    <!-- Bar 2: CodeChef (200+) -->
    <g class="cf" style="animation-delay:0.5s">
      <rect x="85" y="-75" width="40" height="75" fill="url(#bar2)" class="grow" style="animation-delay:0.3s" rx="2"/>
      <rect x="85" y="-75" width="40" height="75" fill="none" stroke="#7b61ff" stroke-width="0.6" opacity="0.5" class="grow" style="animation-delay:0.3s" rx="2"/>
      <polygon points="85,-75 125,-75 145,-87 105,-87" fill="#7b61ff" opacity="0.25"/>
      <polygon points="125,-75 145,-87 145,-12 125,0" fill="#7b61ff" opacity="0.1"/>
      <text x="105" y="15" text-anchor="middle" font-family="'Consolas',monospace" font-size="8" fill="#8b949e">CodeChef</text>
      <text x="105" y="-83" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="13" fill="#7b61ff" font-weight="700" filter="url(#glow)" class="num" style="animation-delay:0.7s">200+</text>
    </g>

    <!-- Bar 3: CGPA (9.52) -->
    <g class="cf" style="animation-delay:1s">
      <rect x="155" y="-130" width="40" height="130" fill="url(#bar3)" class="grow" style="animation-delay:0.5s" rx="2"/>
      <rect x="155" y="-130" width="40" height="130" fill="none" stroke="#ff61d4" stroke-width="0.6" opacity="0.5" class="grow" style="animation-delay:0.5s" rx="2"/>
      <polygon points="155,-130 195,-130 215,-142 175,-142" fill="#ff61d4" opacity="0.25"/>
      <polygon points="195,-130 215,-142 215,-12 195,0" fill="#ff61d4" opacity="0.1"/>
      <text x="175" y="15" text-anchor="middle" font-family="'Consolas',monospace" font-size="8" fill="#8b949e">CGPA</text>
      <text x="175" y="-138" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ff61d4" font-weight="700" filter="url(#glow)" class="num" style="animation-delay:0.9s">9.52</text>
    </g>

    <!-- Bar 4: Rating (1738) -->
    <g class="cf" style="animation-delay:1.5s">
      <rect x="225" y="-105" width="40" height="105" fill="url(#bar4)" class="grow" style="animation-delay:0.7s" rx="2"/>
      <rect x="225" y="-105" width="40" height="105" fill="none" stroke="#00d4ff" stroke-width="0.6" opacity="0.5" class="grow" style="animation-delay:0.7s" rx="2"/>
      <polygon points="225,-105 265,-105 285,-117 245,-117" fill="#00d4ff" opacity="0.25"/>
      <polygon points="265,-105 285,-117 285,-12 265,0" fill="#00d4ff" opacity="0.1"/>
      <text x="245" y="15" text-anchor="middle" font-family="'Consolas',monospace" font-size="8" fill="#8b949e">LC Rating</text>
      <text x="245" y="-113" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="13" fill="#00d4ff" font-weight="700" filter="url(#glow)" class="num" style="animation-delay:1.1s">1738</text>
    </g>

    <!-- Bar 5: Hackathons -->
    <g class="cf" style="animation-delay:2s">
      <rect x="295" y="-90" width="40" height="90" fill="url(#bar1)" class="grow" style="animation-delay:0.9s" rx="2"/>
      <rect x="295" y="-90" width="40" height="90" fill="none" stroke="#00f5d4" stroke-width="0.6" opacity="0.5" class="grow" style="animation-delay:0.9s" rx="2"/>
      <polygon points="295,-90 335,-90 355,-102 315,-102" fill="#00f5d4" opacity="0.25"/>
      <polygon points="335,-90 355,-102 355,-12 335,0" fill="#00f5d4" opacity="0.1"/>
      <text x="315" y="15" text-anchor="middle" font-family="'Consolas',monospace" font-size="8" fill="#8b949e">Hackathons</text>
      <text x="315" y="-98" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="13" fill="#00f5d4" font-weight="700" filter="url(#glow)" class="num" style="animation-delay:1.3s">3 Wins</text>
    </g>
  </g>

  <!-- ═══ RIGHT: Achievement Cards ═══ -->
  <g transform="translate(500, 50)" filter="url(#shadow)">
    <!-- Achievement 1 -->
    <g>
      <rect width="330" height="42" rx="8" fill="#0f1729" stroke="#00f5d4" stroke-width="0.5" opacity="0.8"/>
      <text x="14" y="17" font-family="'Segoe UI',sans-serif" font-size="18">&#x1F3C6;</text>
      <text x="40" y="17" font-family="'Segoe UI',sans-serif" font-size="11" fill="#00f5d4" font-weight="600">1st Runner-Up</text>
      <text x="40" y="33" font-family="'Consolas',monospace" font-size="9" fill="#8b949e">One Earth Intl. Hackathon &#x2022; 5000+ teams</text>
      <circle cx="315" cy="21" r="4" fill="#00f5d4" class="pl" filter="url(#glow)"/>
    </g>
    <!-- Achievement 2 -->
    <g transform="translate(0, 50)">
      <rect width="330" height="42" rx="8" fill="#0f1729" stroke="#7b61ff" stroke-width="0.5" opacity="0.8"/>
      <text x="14" y="17" font-family="'Segoe UI',sans-serif" font-size="18">&#x1F3A8;</text>
      <text x="40" y="17" font-family="'Segoe UI',sans-serif" font-size="11" fill="#7b61ff" font-weight="600">Best UI/UX Award</text>
      <text x="40" y="33" font-family="'Consolas',monospace" font-size="9" fill="#8b949e">HackOrbital 2026, IIST &#x2022; 75 teams</text>
      <circle cx="315" cy="21" r="4" fill="#7b61ff" class="pl" filter="url(#glow)" style="animation-delay:0.5s"/>
    </g>
    <!-- Achievement 3 -->
    <g transform="translate(0, 100)">
      <rect width="330" height="42" rx="8" fill="#0f1729" stroke="#ff61d4" stroke-width="0.5" opacity="0.8"/>
      <text x="14" y="17" font-family="'Segoe UI',sans-serif" font-size="18">&#x1F916;</text>
      <text x="40" y="17" font-family="'Segoe UI',sans-serif" font-size="11" fill="#ff61d4" font-weight="600">Runner-Up — AI Hackathon</text>
      <text x="40" y="33" font-family="'Consolas',monospace" font-size="9" fill="#8b949e">Pragyan 2026, NIT Trichy</text>
      <circle cx="315" cy="21" r="4" fill="#ff61d4" class="pl" filter="url(#glow)" style="animation-delay:1s"/>
    </g>
  </g>

  <rect x="1" y="1" width="848" height="218" rx="10" fill="none" stroke="#00f5d4" stroke-width="0.3" opacity="0.1"/>
</svg>
